server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statement PDFs and CSV imports are uploaded through /api; nginx's 1 MB default refused
    # most real statements with a 413.
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these file names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A manual Gmail backfill runs inside the request; the 60 s default cut it off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;
}
