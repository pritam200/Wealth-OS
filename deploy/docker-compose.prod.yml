# Production stack for one Oracle Cloud "Always Free" Ampere VM (arm64). See DEPLOY.md.
#
#   DEPLOY_SECRET_KEY=... ./deploy.sh      (decrypts secrets, runs the command below, cleans up)
#   docker compose -f deploy/docker-compose.prod.yml --env-file .tmp-secrets/deploy.env up -d --build
#
# Only Caddy publishes ports (80/443, HTTPS certificates are automatic). Redis, the backend and
# Ollama are reachable only on the internal Docker network — never from the internet. Postgres is
# not in this stack: it runs locally on the host machine only (see README, "Postgres is local").

name: marketai

services:

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Postgres is NOT part of this stack: it is the local server on the host machine. The container
    # reaches it through the host gateway (Linux needs this mapping; Docker Desktop has it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Decrypted at deploy time by scripts/secrets.sh into ../.tmp-secrets (deleted when deploy.sh
    # exits). Later files win, so the production values in deploy.env take precedence. Nothing
    # here is copied into an image layer: the build context is ../backend only.
    env_file:
      - path: ../.tmp-secrets/.env
        required: false
      - path: ../.tmp-secrets/gmail.env
        required: false
      - path: ../.tmp-secrets/deploy.env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Admin console: the hosted stack is PRODUCTION unless deploy.env says otherwise; Caddy reaches the
      # backend over the Docker bridge, so X-Forwarded-For is trusted from there and nowhere else.
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-PRODUCTION}
      ADMIN_TRUSTED_PROXIES: ${ADMIN_TRUSTED_PROXIES:-172.16.0.0/12}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: https://${DOMAIN}
      GMAIL_REDIRECT_URI: https://${DOMAIN}/api/gmail/callback
      OLLAMA_BASE_URL: http://ollama:11434
      TZ: Asia/Kolkata
    # Spring Boot plus 41 scheduled jobs; the JVM takes 75% of this as heap.
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  frontend:
    build:
      context: ../frontend
      args:
        # Empty = same origin: the browser calls /api on this domain and nginx proxies it to
        # the backend, so there is no CORS and no second hostname to secure.
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # Local model for the non-email AI features (advisor, narratives). Email reading uses Gemini.
  # Optional: start with `--profile ollama`, then pull the model once (see DEPLOY.md). Without
  # it, set LLM_PROVIDER=gemini in .env.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 12g

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  ollama_data:
