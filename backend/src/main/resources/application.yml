spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketai_db}
    username: ${DB_USER:marketai}
    password: ${DB_PASSWORD:marketai_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: simple

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:S3cr3tK3yF0rD3v0nlyChangeInProd1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmn}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-1.5-flash

  yahoo-finance:
    base-url: https://query1.finance.yahoo.com
    timeout-seconds: 10

  news:
    refresh-rate-ms: 1800000

  # RecommendationEngine composite-score weights (stocks only — MFs use a separate
  # tax/holding-period rule set). Must sum to 100.
  recommendation:
    weights:
      technical: 30
      momentum: 20
      valuation: 20
      sentiment: 30

  # Add your ngrok frontend URL here (comma-separated) when tunneling, e.g.
  # CORS_ALLOWED_ORIGINS=http://localhost:5173,https://7aee-153-72-47-54.ngrok-free.app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

  security:
    # Base64, 32-byte AES-256 key used to encrypt saved statement-unlock passwords.
    # Generate one with: openssl rand -base64 32
    pdf-password-key: ${PDF_PASSWORD_ENC_KEY:}

gmail:
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  # Must exactly match an "Authorized redirect URI" registered on the OAuth client
  # in Google Cloud Console — update both when switching to an ngrok URL.
  redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
  # Where the backend sends the browser back to after the OAuth callback completes.
  frontend-url: ${FRONTEND_URL:http://localhost:5174}

logging:
  level:
    com.marketai: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-1.5-flash

  yahoo-finance:
    base-url: https://query1.finance.yahoo.com
    timeout-seconds: 10

  news:
    api-key: ${NEWS_API_KEY}
    base-url: https://newsapi.org/v2

  cors:
    allowed-origins:
      - ${FRONTEND_URL}

logging:
  level:
    com.marketai: INFO
    root: WARN
