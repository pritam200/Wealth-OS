spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketai_db}
    username: ${DB_USER:marketai}
    password: ${DB_PASSWORD:marketai_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: simple

  # Generic SMTP relay for outbound mail (registration OTP today). No default host on
  # purpose — same convention as app.security.pdf-password-key below: an unset relay must
  # fail loudly when something tries to send mail, never silently pretend to succeed.
  # Point these at whatever relay you have (a company relay, Mailtrap for local testing,
  # a provider's SMTP endpoint, etc).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000

server:
  port: 8080

management:
  # Only /actuator/health is allowlisted in SecurityConfig — restrict exposure to match, rather
  # than exposing the full actuator surface (env, beans, heapdump, ...) by accident.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  servlet:
    context-path: /

app:
  jwt:
    # No default on purpose. When unset, JwtService generates a strong random secret and
    # persists it to the gitignored gmail.env — a committed signing key would let anyone
    # with the repo mint a valid token for any account.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  # Optional hosted provider — nothing requires it, since app.llm.provider defaults to the
  # local Ollama model. The model name is env-overridable because Google retires them:
  # gemini-1.5-* is no longer served to newly created API keys.
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: ${GEMINI_MODEL:gemini-3.6-flash}

  sync:
    worker:
      # Small on purpose: the expensive step is the local LLM (~8s/email), and running many
      # at once on one machine makes each slower rather than finishing sooner.
      concurrency: 2
      stale-after-minutes: 90

  gmail:
    push:
      # Push is a latency optimisation only — the scheduled poll is never disabled, because
      # Gmail caps notifications at 1/sec/user and silently drops the excess.
      enabled: ${GMAIL_PUSH_ENABLED:false}
      topic: ${GMAIL_PUSH_TOPIC:}
      # Shared secret appended to the push endpoint URL; the endpoint is unauthenticated by
      # necessity since Google calls it.
      verification-token: ${GMAIL_PUSH_TOKEN:}

  # AI reasoning layer. Local-first: Ollama needs no key and nothing leaves the machine.
  # provider = ollama | gemini | none  ("none" disables every LLM path; the deterministic
  # parsers and all arithmetic keep working, since the AI layer is strictly additive.)
  llm:
    provider: ${LLM_PROVIDER:ollama}
    fallback-enabled: ${LLM_FALLBACK_ENABLED:true}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      # qwen2.5:7b is the throughput choice — a full sync classifies hundreds of emails and
      # the 14b takes several seconds each. Override to qwen2.5:14b for higher-accuracy,
      # low-volume tasks (ambiguity resolution, advisory).
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      timeout-seconds: 120
      # Pinned to 0: classification and extraction must be reproducible run to run.
      temperature: 0.0
    # Below this confidence an extraction is never auto-imported — it goes to human review.
    min-confidence: 0.85

  yahoo-finance:
    base-url: https://query1.finance.yahoo.com
    timeout-seconds: 10

  news:
    refresh-rate-ms: 1800000

  # RecommendationEngine composite-score weights (stocks only — MFs use a separate
  # tax/holding-period rule set).
  #
  # These MUST sum to 100 — AnalystService.validateWeights fails startup otherwise, because a
  # set summing to 90 silently shrinks every composite by a tenth and moves stocks across the
  # BUY/HOLD/SELL thresholds with nothing reporting it.
  #
  # Weights changed from 30/20/20/30. Two reasons, both from the competitive research in
  # docs/research/COMPETITIVE_RESEARCH.md:
  #
  #   - technical and momentum are both derived from price and are highly correlated, so
  #     30+20 double-counted the same signal. Their combined share drops 50 -> 40.
  #   - sentiment at 30% put the largest single weight on the softest input. Value Research,
  #     the most methodologically transparent Indian rater, does not use sentiment as a rating
  #     input at all, and weights valuation highest.
  #
  # Valuation is raised to 40, making it the largest weight, to match that principle. Sentiment is reduced rather than removed: without a
  # fundamentals feed there is no quality or growth factor to absorb the freed weight, and
  # leaving it on price would deepen the double-count this change exists to reduce.
  recommendation:
    weights:
      technical: 25
      momentum: 15
      valuation: 40
      sentiment: 20

  # Add your ngrok frontend URL here (comma-separated) when tunneling, e.g.
  # CORS_ALLOWED_ORIGINS=http://localhost:5173,https://7aee-153-72-47-54.ngrok-free.app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

  security:
    # Base64, 32-byte AES-256 key used to encrypt saved statement-unlock passwords.
    # Generate one with: openssl rand -base64 32
    pdf-password-key: ${PDF_PASSWORD_ENC_KEY:}

  # Registration email-OTP verification (EmailOtpService). The code itself is never stored
  # in plaintext — hashed with the same BCrypt encoder as passwords — so a DB read can't
  # recover it.
  otp:
    from: ${MAIL_FROM:MarketAI <no-reply@marketai.local>}
    expiry-minutes: 10
    resend-cooldown-seconds: 45
    max-attempts: 5
    # How long a verified-email token stays valid before the actual /register call must use
    # it — long enough to fill in name/password, short enough that a leaked token is useless
    # by the time anyone else could find it.
    verification-token-ttl-minutes: 20

gmail:
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  # Must exactly match an "Authorized redirect URI" registered on the OAuth client
  # in Google Cloud Console — update both when switching to an ngrok URL.
  redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
  # Where the backend sends the browser back to after the OAuth callback completes.
  frontend-url: ${FRONTEND_URL:http://localhost:5174}

logging:
  level:
    com.marketai: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  # Empty default on purpose: Gemini is an OPTIONAL provider, so prod must not refuse to
  # start just because no hosted-AI key was supplied. It previously used ${GEMINI_API_KEY}
  # with no default, which made a missing optional key a fatal startup failure.
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: ${GEMINI_MODEL:gemini-3.6-flash}

  # Mirrors the dev block. Prod previously declared no app.llm at all and silently relied on
  # the @Value defaults compiled into the Java, so the provider could not be configured here.
  llm:
    provider: ${LLM_PROVIDER:ollama}
    fallback-enabled: ${LLM_FALLBACK_ENABLED:true}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
      temperature: 0.0
    min-confidence: ${LLM_MIN_CONFIDENCE:0.85}

  yahoo-finance:
    base-url: https://query1.finance.yahoo.com
    timeout-seconds: 10

  news:
    api-key: ${NEWS_API_KEY}
    base-url: https://newsapi.org/v2

  cors:
    allowed-origins:
      - ${FRONTEND_URL}

logging:
  level:
    com.marketai: INFO
    root: WARN
